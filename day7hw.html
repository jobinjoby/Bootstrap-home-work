<html lang="en">

    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotional Banners</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>

<div id="demo1" class="carousel slide" data-ride="carousel">
  <ul class="carousel-indicators">
    <li data-target="#demo1" data-slide-to="0" class="active"></li>
    <li data-target="#demo1" data-slide-to="1"></li>
    <li data-target="#demo1" data-slide-to="2"></li>
  </ul>

  <div class="carousel-inner">

    
    <div class="carousel-item active">
      <img src="https://cdn1.tripoto.com/media/filter/tst/img/1634206/SpotDocument/1568948129_dsc_0571_1_01.jpeg" width="1520" height="700">
      <div class="carousel-caption">
        <h2 class="text-white">Explore Vagamon</h2>
        <button type="button" class="btn btn-success" data-toggle="modal" data-target="#myModal">
            Book Now
        </button>
      </div>
    </div>

    
    <div class="carousel-item">
      <img src="https://image3.mouthshut.com/images/imagesp/925013728s.jpg" width="1520" height="700">
      <div class="carousel-caption">
        <h3 class="text-white">Discover Thekkady – Where Nature Roars and Serenity Unfolds!</h3>
        <button type="button" class="btn btn-success" data-toggle="modal" data-target="#myModal">
            Book Now
        </button>
      </div>
    </div>

   
    <div class="carousel-item">
      <img src="https://tramptraveller.com/wp-content/uploads/2022/09/12015080410225742630-1626x1080.jpg" width="1520" height="700">
      <div class="carousel-caption">
        <h3 class="text-white">Escape to Ramakkalmedu – Where the Wind Whispers Stories!</h3>
        <button type="button" class="btn btn-success" data-toggle="modal" data-target="#myModal">
            Book Now
        </button>
      </div>
    </div>

  </div>

  <a class="carousel-control-prev" href="#demo1" data-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </a>
  <a class="carousel-control-next" href="#demo1" data-slide="next">
    <span class="carousel-control-next-icon"></span>
  </a>
</div>
<div class="modal " id="myModal">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Booking opens now</h4>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
       contact us for bookings:+91 7510722882
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-dismiss="modal">Close</button>
        </div>
        


        </div>

    </div>
  </div>
</div>

<a href="#" data-toggle="tooltip" title="use the book now button for bookings!">How to book</a>




</body>
</html>
